name: Benchmarks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Run benchmark
      run: cargo bench --bench performance --bench throughput --bench hash_bench --bench hash_bench2 --bench hash_bench3 --bench hash_bench_reuse --bench hash_bench_reuse2 --bench hash_bench_reuse_full --bench intersect_bench -- --output-format bencher | tee output.txt
    - name: Ensure benchmarks branch exists
      run: |
        git ls-remote --exit-code --heads origin benchmarks || (
          PREV=$(git rev-parse HEAD)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan benchmarks
          git rm -rf .
          git commit --allow-empty -m "Init benchmarks branch"
          git push origin benchmarks
          git checkout $PREV
        )
    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'cargo'
        output-file-path: output.txt
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        gh-pages-branch: 'benchmarks'
        benchmark-data-dir-path: 'benchmarks'
