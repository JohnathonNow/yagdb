name: Benchmarks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Run benchmark
      run: cargo bench --bench performance --bench throughput --bench hash_bench --bench hash_bench2 --bench hash_bench3 --bench hash_bench_reuse --bench hash_bench_reuse2 --bench hash_bench_reuse_full --bench intersect_bench -- --output-format bencher | tee output.txt
    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'cargo'
        output-file-path: output.txt
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        gh-pages-branch: 'benchmarks'
        benchmark-data-dir-path: 'benchmarks'
